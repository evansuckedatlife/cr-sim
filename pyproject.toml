[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cr-sim"
version = "0.0.1"
description = "Mechanically exact Clash Royale battle simulator for ML research"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
rl = ["gymnasium>=0.29", "numpy>=1.26"]

[project.scripts]
cr-sim = "cr_sim.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cr_sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
